<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Picks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- ... (header and tabs are unchanged) ... -->
    </div>

    <script>
        // ... (all other JS functions are the same, except populatePortfolio) ...

        function populatePortfolio(portfolioName) {
            const summaryDiv = document.getElementById(`portfolio-summary-${portfolioName}`);
            const holdingsTableBody = document.getElementById(`portfolio-holdings-${portfolioName}`).querySelector('tbody');
            const holdingsTableHead = document.getElementById(`portfolio-holdings-${portfolioName}`).querySelector('thead');
            const portfolioUrl = `${API_BASE_URL.replace(/\/$/, '')}/api/portfolio/${portfolioName}`;

            summaryDiv.innerHTML = SPINNER_HTML;
            holdingsTableBody.innerHTML = '';

            fetch(portfolioUrl)
                .then(response => { if (!response.ok) throw new Error(`Network error`); return response.json(); })
                .then(data => {
                    if (data.error) throw new Error(data.error);

                    summaryDiv.innerHTML = `...`; // Unchanged summary logic

                    holdingsTableHead.innerHTML = `<tr><th>Ticker</th><th>Flag</th><th>Shares</th><th>Purchase Price</th><th>Purchase Date</th><th>Current Price</th><th>Current Value</th></tr>`;
                    holdingsTableBody.innerHTML = '';
                    if (data.holdings && data.holdings.length > 0) {
                        data.holdings.forEach(h => {
                            const row = holdingsTableBody.insertRow();
                            const flag_html = h.sell_flag ? '<span class="sell-flag">●</span>' : '';

                            // Calculate cost basis and determine return class
                            const cost_basis = h.shares * h.purchase_price;
                            let return_class = '';
                            if (h.current_value > cost_basis) {
                                return_class = 'positive-return';
                            } else if (h.current_value < cost_basis) {
                                return_class = 'negative-return';
                            }

                            row.innerHTML = `
                                <td>${createTickerLink(h.ticker)}</td>
                                <td style="text-align: center;">${flag_html}</td>
                                <td>${h.shares.toFixed(6)}</td>
                                <td>$${h.purchase_price.toFixed(2)}</td>
                                <td>${h.purchase_date}</td>
                                <td>$${h.current_price.toFixed(2)}</td>
                                <td class="${return_class}">$${h.current_value.toFixed(2)}</td>
                            `;
                        });
                    } else {
                        holdingsTableBody.innerHTML = `<tr><td colspan="7">No holdings yet.</td></tr>`;
                    }
                })
                .catch(error => {
                    console.error(`Error fetching portfolio data for ${portfolioName}:`, error);
                    summaryDiv.innerHTML = `<p>Could not load portfolio data.</p>`;
                });
        }

        // ... (rest of the script)
    </script>
</body>
</html>
