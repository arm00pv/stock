<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Picks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div id="timer-container">
            Next pick in: <span id="countdown"></span>
        </div>
        <div class="tabs">
            <button class="tab-link active" onclick="openTab(event, 'HotStocks')">Hot Stocks</button>
            <button class="tab-link" onclick="openTab(event, 'PennyStocks')">$5 or Less</button>
            <button class="tab-link" onclick="openTab(event, 'MonthlyDividend')">Monthly Dividend</button>
            <button class="tab-link" onclick="openTab(event, 'HighYield')">High Yield</button>
            <button class="tab-link" onclick="openTab(event, 'PortfolioMain')">$5 Portfolio</button>
            <button class="tab-link" onclick="openTab(event, 'PortfolioMonthly')">$5 Monthly Portfolio</button>
            <button class="tab-link" onclick="openTab(event, 'PortfolioDaily')">$5 Daily Portfolio</button>
            <button class="tab-link" onclick="openTab(event, 'PortfolioHighYield')">$5 High Yield Portfolio</button>
        </div>

        <!-- All tab content divs are the same -->
        <!-- ... -->

    </div>

    <script>
        // ... (all other JS functions are the same)

        function startCountdown() {
            const countdownSpan = document.getElementById('countdown');
            if (!countdownSpan) return;

            function update() {
                // We need a robust way to get NY time without a full library.
                // This is a simplified approach that gets the UTC time and subtracts the
                // estimated offset for New York. It doesn't handle DST perfectly but is more
                // robust than toLocaleString().
                const now = new Date();
                const utc_time = now.getTime() + (now.getTimezoneOffset() * 60000);
                const ny_time = new Date(utc_time - (3600000 * 4)); // Assume EDT (UTC-4)

                let nextPickTime = new Date(ny_time);
                nextPickTime.setHours(8, 0, 0, 0);

                if (ny_time > nextPickTime) {
                    nextPickTime.setDate(nextPickTime.getDate() + 1);
                }

                const diff = nextPickTime.getTime() - ny_time.getTime();

                if (diff < 0) {
                    countdownSpan.textContent = "Waiting for next pick...";
                    return;
                }

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                countdownSpan.textContent = `${hours}h ${mins}m ${secs}s`;
            }
            update();
            setInterval(update, 1000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            startCountdown();
            // ... (rest of the listener is the same)
        });
    </script>
</body>
</html>
