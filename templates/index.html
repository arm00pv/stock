<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Picks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div id="timer-container">
            Next pick in: <span id="countdown"></span>
        </div>
        <div class="tabs">
            <button class="tab-link active" onclick="openTab(event, 'HotStocks')">Hot Stocks</button>
            <button class="tab-link" onclick="openTab(event, 'PennyStocks')">Penny Stocks</button>
            <button class="tab-link" onclick="openTab(event, 'MonthlyDividend')">Monthly Dividend</button>
            <button class="tab-link" onclick="openTab(event, 'HighYield')">High Yield</button>
        </div>

        <div id="HotStocks" class="tab-content" style="display:block;">
            <h1>Hot Stock of the Day</h1>
            <div id="hot-daily-pick" class="daily-pick-container">
                <p>Loading...</p>
            </div>
            <h2>Historical Picks</h2>
            <div id="hot-historical-picks" class="historical-picks-container">
                <ul></ul>
            </div>
        </div>

        <div id="PennyStocks" class="tab-content">
            <h1>Hot Penny Stock of the Day</h1>
            <div id="penny-daily-pick" class="daily-pick-container">
                <p>Loading...</p>
            </div>
            <h2>Historical Picks</h2>
            <div id="penny-historical-picks" class="historical-picks-container">
                <ul></ul>
            </div>
        </div>

        <div id="MonthlyDividend" class="tab-content">
            <h1>Monthly Dividend Pick of the Day</h1>
            <div id="monthly-daily-pick" class="daily-pick-container">
                <p>Loading...</p>
            </div>
            <h2>Historical Picks</h2>
            <div id="monthly-historical-picks" class="historical-picks-container">
                <ul></ul>
            </div>
        </div>

        <div id="HighYield" class="tab-content">
            <h1>High Yield Pick of the Day</h1>
            <div id="high-yield-daily-pick" class="daily-pick-container">
                <p>Loading...</p>
            </div>
            <h2>Historical Picks</h2>
            <div id="high-yield-historical-picks" class="historical-picks-container">
                <ul></ul>
            </div>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-link");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        function populatePicks(endpoint, dailyPickId, historicalPicksId) {
            const dailyPickDiv = document.getElementById(dailyPickId);
            const historicalPicksList = document.querySelector(`#${historicalPicksId} ul`);

            fetch(endpoint)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.ticker && !data.ticker.startsWith('No')) {
                        dailyPickDiv.innerHTML = `<h2><a href="https://finance.yahoo.com/quote/${data.ticker}" target="_blank" class="ticker-link">${data.ticker}</a></h2>`;
                    } else {
                        dailyPickDiv.innerHTML = `<p>${data.ticker}</p>`;
                    }

                    historicalPicksList.innerHTML = ''; // Clear previous list
                    if (data.history && data.history.length > 0) {
                        data.history.forEach(pick => {
                            const li = document.createElement('li');
                            const tickerLink = `<a href="https://finance.yahoo.com/quote/${pick.ticker}" target="_blank" class="ticker-link">${pick.ticker}</a>`;
                            li.innerHTML = `${pick.date}: ${tickerLink}`;
                            historicalPicksList.appendChild(li);
                        });
                    } else {
                        const li = document.createElement('li');
                        li.textContent = 'No historical data available.';
                        historicalPicksList.appendChild(li);
                    }
                })
                .catch(error => {
                    console.error('Error fetching stock data:', error);
                    dailyPickDiv.innerHTML = `<p>Could not load stock data.</p>`;
                });
        }

        function startCountdown() {
            const countdownElement = document.getElementById('countdown');

            function updateTimer() {
                // Get current time in UTC
                const now = new Date();

                // Calculate New York time (UTC-4 during EDT, UTC-5 during EST)
                // This is a simplification. A robust solution would use a library for timezones.
                // For now, we'll assume EDT (UTC-4) for simplicity as it covers most of the year.
                const nowUtc = now.getTime() + (now.getTimezoneOffset() * 60000);
                const nowNewYork = new Date(nowUtc - (3600000 * 4));

                // Set target time to 8:00 AM NY time
                let target = new Date(nowNewYork);
                target.setHours(8, 0, 0, 0);

                // If it's already past 8:00 AM, set the target for tomorrow
                if (nowNewYork.getTime() > target.getTime()) {
                    target.setDate(target.getDate() + 1);
                }

                const diff = target - nowNewYork;

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                countdownElement.textContent = `${hours}h ${minutes}m ${seconds}s`;
            }

            setInterval(updateTimer, 1000);
            updateTimer(); // Initial call
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Start the countdown timer
            startCountdown();

            // Populate all tabs on page load
            populatePicks("{{ url_for('hot_stock') }}", 'hot-daily-pick', 'hot-historical-picks');
            populatePicks("{{ url_for('penny_stock') }}", 'penny-daily-pick', 'penny-historical-picks');
            populatePicks("{{ url_for('monthly_dividend_stock') }}", 'monthly-daily-pick', 'monthly-historical-picks');
            populatePicks("{{ url_for('high_yield_dividend_stock') }}", 'high-yield-daily-pick', 'high-yield-historical-picks');
        });
    </script>
</body>
</html>
